name: Refresh Packwiz Index

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh index hashes
        run: packwiz refresh

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.toml
          git diff --cached --quiet || git commit -m "chore: refresh packwiz index hashes [skip ci]"
          git push
