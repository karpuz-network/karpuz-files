name: Validate Pack Metadata

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Packwiz integrity chain
        run: python scripts/validate_pack.py
