name: Sync Crafty Mods

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-crafty-mods
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3

      - name: Download, verify and publish Crafty mods
        id: sync
        env:
          CRAFTY_BASE_URL: https://crafty.ogut.su
          CRAFTY_SERVER_ID: ea66dcd1-c015-43bb-9b0f-8dba936f45b5
          CRAFTY_API_TOKEN: ${{ secrets.CRAFTY_API_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: karpuznetworkmods
          R2_PUBLIC_BASE_URL: https://mods.karpuz.network
        run: python scripts/sync_crafty_mods.py

      - name: Setup Go
        if: steps.sync.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Refresh Packwiz metadata
        if: steps.sync.outputs.changed == 'true'
        run: |
          go install github.com/packwiz/packwiz@latest
          packwiz refresh
          python scripts/finalize_pack.py

      - name: Commit manifest update
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mods-manifest.json index.toml pack.toml
          git commit -m "chore: sync ${{ steps.sync.outputs.mod_count }} Crafty mods [skip ci]"
          git push
